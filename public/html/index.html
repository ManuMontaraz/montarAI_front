<!DOCTYPE html>
<html lang="[language]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="media/images/favicon.ico">
    <title mtrans="text|in_development"></title>

    <link rel='stylesheet' type='text/css' media='screen' href='css/style.css'>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/app.js"></script>
    <script src="js/multilang.js"></script>
    <script src="js/session.js"></script>
    <script src="js/socket-auth.js"></script>
</head>
<body>
    <section>
        <nav>
            <div>
                <img id="navTree" src="images/navTree.svg" alt="tree navbar">
            </div>
            <div class="navLeaf">
                <img src="images/leaf.svg" alt="leaf icon">
                <a href="#" mtrans="text|home"></a>
            </div>
            <a href="#" mtrans="text|about"></a>
            <a href="#" mtrans="text|contact"></a>
        </nav>
    </section>
    <h1 mtrans="text|in_development,title|in_development"></h1>
    <select id="select_lang" onchange="set_language(this.value)">
        <option value="es">Español</option>
        <option value="en">English</option>
    </select>
    <form id="register">
        <input id="register_email" type="email" mtrans="placeholder|email"></input>
        <input id="register_password" type="password" mtrans="placeholder|password"></input>
        <input id="register_repeat_password" type="password" mtrans="placeholder|repeat_password"></input>
        <input id="register_first_name" type="text" mtrans="placeholder|first_name"></input>
        <input id="register_last_name" type="text" mtrans="placeholder|last_name"></input>
        <input id="register_phone" type="text" mtrans="placeholder|phone"></input>
        <button id="register_submit" type="submit" mtrans="text|register" onclick="register_user(event)"></button>
    </form>
    <form id="login">
        <input id="login_email" type="email" mtrans="placeholder|email"></input>
        <input id="login_password" type="password" mtrans="placeholder|password"></input>
        <label for="login_remember_me" mtrans="text|remember_me"></label>
        <input id="login_remember_me" type="checkbox" mtrans="title|remember_me"></input>
        <button id="login_submit" type="submit" mtrans="text|login" onclick="login(event)"></button>
        <a href="#" onclick="showForgotPassword(event)" mtrans="text|forgot_password">¿Olvidaste tu contraseña?</a>
    </form>
    <form id="forgot_password_form" class="hidden">
        <h3 mtrans="text|forgot_password_title">Recuperar contraseña</h3>
        <input id="forgot_password_email" type="email" mtrans="placeholder|email"></input>
        <button id="forgot_password_submit" type="submit" mtrans="text|send" onclick="sendForgotPassword(event)"></button>
        <button type="button" mtrans="text|back" onclick="backToLogin()">Volver</button>
    </form>
    <div id="forgot_password_success" class="hidden">
        <h3 mtrans="text|forgot_password_success">Email enviado</h3>
        <p mtrans="text|check_email">Revisa tu email para restablecer la contraseña</p>
        <button mtrans="text|back_to_login" onclick="backToLogin()">Volver al login</button>
    </div>
    <button mtrans="text|logout,title|logout" onclick="logout(event)"></button>
    <div id="is_logged_in"></div>
</body>
</html>
